    const casesData = {

            nerves: [
                { mechanism: "falling asleep with {pos} arm draped over a park bench", exam: "demonstrates a profound 'wrist drop'. {pro} cannot extend the wrist or digits at the MCP joints. Sensory loss is noted over the posterior forearm.", diagnostic: "EMG: Denervation in brachioradialis and extensor carpi radialis. Normal signal in triceps brachii.", options: ["Radial Nerve (Spiral Groove)", "Radial Nerve (Axilla)", "Posterior Interosseous Nerve", "Median Nerve (Elbow)"], answer: 0, explanation: "Classic 'Saturday Night Palsy'. Compression in the spiral groove affects the nerve AFTER branches to the triceps have exited." },
                { mechanism: "typing for 10 straight hours at an unergonomic desk setup", exam: "reports waking up shaking {pos} hand due to burning pain in the index and middle fingers. Sensation over the thenar eminence is preserved.", diagnostic: "NCV: Prolonged distal latency across the flexor retinaculum.", options: ["Pronator Teres Syndrome", "C6 Radiculopathy", "Ulnar Tunnel Syndrome", "Carpal Tunnel Syndrome"], answer: 3, explanation: "Carpal Tunnel Syndrome affects the median nerve. The palmar cutaneous branch passes OVER the flexor retinaculum, sparing sensation to the thumb base." },
                { mechanism: "sustaining a severe fracture to the medial epicondyle of the humerus after a fall", exam: "presents with numbness over the pinky finger and medial half of the ring finger. {pro} struggles to hold a piece of paper between {pos} fingers.", diagnostic: "Physical Exam: Positive Froment's sign and clawing of the 4th and 5th digits at rest.", options: ["Ulnar Nerve Injury", "Median Nerve Injury", "Radial Nerve Injury", "Musculocutaneous Nerve Injury"], answer: 0, explanation: "The ulnar nerve runs directly posterior to the medial epicondyle (cubital tunnel) and supplies intrinsic hand muscles and sensation to the medial 1.5 digits." },
                { mechanism: "dislocating {pos} shoulder anteriorly", exam: "shows flattening of the shoulder contour and loss of sensation over the lateral aspect of the upper arm.", diagnostic: "X-Ray: Anterior dislocation. Physical Exam: Weakness in shoulder abduction beyond 15 degrees.", options: ["Suprascapular Nerve", "Thoracodorsal Nerve", "Axillary Nerve", "Long Thoracic Nerve"], answer: 2, explanation: "The axillary nerve wraps around the surgical neck of the humerus and is highly susceptible to injury during anterior shoulder dislocations." }

            muscles: [

                { mechanism: "sprinting and suddenly grabbing the back of {pos} thigh", exam: "presents with extensive bruising over the posterior thigh and profound weakness resisting knee flexion.", diagnostic: "MRI: High-grade partial tear at the ischial tuberosity origin.", options: ["Quadriceps Strain", "Hamstring Tear", "Adductor Longus Tear", "Iliopsoas Tear"], answer: 1, explanation: "Hamstring muscles originate on the ischial tuberosity. Eccentric loading can tear the muscle fibers." }

            bones: [
                { mechanism: "slipping on a wet surface", exam: "The {side} leg appears shortened and is prominently externally rotated. {pro} is unable to bear weight.", diagnostic: "X-Ray: Disruption of the bony trabeculae just distal to the femoral head.", options: ["Intertrochanteric Fracture", "Femoral Shaft Fracture", "Femoral Neck Fracture", "Posterior Hip Dislocation"], answer: 2, explanation: "A shortened and externally rotated leg after a fall is classic for a femoral neck fracture." },

                { mechanism: "complaining of chronic fatigue, cold intolerance, and pale conjunctiva", exam: "CBC shows low hemoglobin, small microcytic red blood cells, and reduced MCV.", diagnostic: "Iron panel: Low serum ferritin and iron levels.", options: ["Pernicious Anemia (B12)", "Iron Deficiency Anemia", "Hemolytic Anemia", "Aplastic Anemia"], answer: 1, explanation: "Iron is essential for heme synthesis. Deficiency results in microcytic, hypochromic red blood cells." },
                { mechanism: "giving birth as an Rh-negative mother to a second Rh-positive baby", exam: "The newborn presents with severe jaundice, anemia, and hepatosplenomegaly.", diagnostic: "Direct Coombs Test: Positive for maternal anti-Rh IgG antibodies on infant's RBCs.", options: ["ABO Incompatibility", "Hemolytic Disease of the Newborn", "Physiological Jaundice", "Thalassemia"], answer: 1, explanation: "Maternal IgG antibodies cross the placenta and attack the fetal Rh-positive RBCs, causing hemolysis." },
                { mechanism: "presenting with severe knee swelling (hemarthrosis) after a minor bump", exam: "has a family history of a maternal uncle who bled easily.", diagnostic: "Coagulation Profile: Prolonged PTT, normal PT, and normal bleeding time. Deficient Factor VIII.", options: ["Hemophilia A", "Hemophilia B", "Von Willebrand Disease", "Vitamin K Deficiency"], answer: 0, explanation: "Hemophilia A is an X-linked recessive deficiency of clotting Factor VIII." }
            ],
            nervous_muscular: [
                { mechanism: "complaining of progressive muscle weakness that worsens with repetitive activity and improves after rest", exam: "shows bilateral ptosis (drooping eyelids) and facial muscle weakness.", diagnostic: "Serology: Antibodies against postsynaptic nicotinic acetylcholine receptors.", options: ["Myasthenia Gravis", "Lambert-Eaton Syndrome", "Botulism", "Multiple Sclerosis"], answer: 0, explanation: "Myasthenia Gravis is an autoimmune condition blocking ACh receptors on the motor end plate." },
                { mechanism: "receiving a local anesthetic (Lidocaine) injection prior to a minor skin procedure", exam: "experiences temporary loss of pain sensation in the local area.", diagnostic: "Electrophysiology: The drug prevents the depolarization phase of the action potential.", options: ["Blocking K+ Efflux", "Blocking Voltage-Gated Na+ Channels", "Enhancing GABA", "Blocking Ca2+ Influx"], answer: 1, explanation: "Local anesthetics bind to and block voltage-gated sodium channels, stopping nerve fibers from firing action potentials." },
                { mechanism: "consuming improperly canned homemade vegetables", exam: "presents with descending flaccid paralysis, diplopia (double vision), and dry mouth.", diagnostic: "Toxin Analysis: Cleavage of SNARE proteins at the presynaptic terminal, preventing ACh release.", options: ["Tetanus", "Botulism", "Polio", "Myasthenia Gravis"], answer: 1, explanation: "Botulinum toxin blocks the release of Acetylcholine from presynaptic terminals by destroying SNARE proteins." },
                { mechanism: "being examined post-mortem 6 hours after death", exam: "The body is extremely stiff and joints cannot be passively flexed.", diagnostic: "Cellular Mechanism: Lack of a specific nucleotide to detach myosin heads from actin filaments.", options: ["Calcium Depletion", "ATP Depletion (Rigor Mortis)", "Glycogen Depletion", "Sodium Accumulation"], answer: 1, explanation: "Rigor mortis occurs because ATP is required to break the cross-bridge between actin and myosin." }
            ],
            immune: [
                { mechanism: "developing sudden hives, itching, and wheezing shortly after consuming peanuts", exam: "Vital signs show low blood pressure and rapid pulse.", diagnostic: "Serum test: Elevated allergen-specific IgE binding to mast cells and basophils.", options: ["Type I Hypersensitivity", "Type II Cytotoxic", "Type III Immune Complex", "Type IV Cell-Mediated"], answer: 0, explanation: "Type I hypersensitivity is an immediate allergic reaction mediated by IgE and rapid histamine release." },
                { mechanism: "developing a red, swollen, blistering rash 48 hours after hiking in the woods", exam: "presents with localized dermatitis precisely where plants brushed against the skin.", diagnostic: "Biopsy: Infiltration of sensitized T-lymphocytes and macrophages (no antibodies involved).", options: ["Type I Hypersensitivity", "Type II Hypersensitivity", "Type III Hypersensitivity", "Type IV Hypersensitivity"], answer: 3, explanation: "Type IV hypersensitivity is cell-mediated (T-cells), taking 48-72 hours to develop (e.g., Poison Ivy)." },
                { mechanism: "recovering from a viral infection 6 months ago and re-exposed to the exact same virus today", exam: "remains completely asymptomatic despite heavy exposure.", diagnostic: "Serology: High levels of circulating, high-affinity IgG antibodies against the virus.", options: ["Primary Immune Response", "Secondary (Memory) Immune Response", "Innate Immunity Activation", "Passive Immunization"], answer: 1, explanation: "The secondary response (memory B and T cells) produces rapid, high-affinity IgG to neutralize the pathogen before symptoms appear." },
                { mechanism: "presenting with recurrent bacterial, fungal, and viral infections since 6 months of age", exam: "Thymus shadow is completely absent on chest X-ray.", diagnostic: "Flow Cytometry: Profound lack of mature T-cells, severely compromising both cellular and humoral immunity.", options: ["DiGeorge Syndrome", "Severe Combined Immunodeficiency (SCID)", "X-linked Agammaglobulinemia", "Selective IgA Deficiency"], answer: 1, explanation: "SCID is a severe genetic defect leading to a lack of functional T-cells (and often B-cells), making the patient extremely vulnerable to all infections." }
            ]
        }
    };

    let lastIndex = -1;

    function launchSimulator(region, category) {
        currentRegion = region;
        currentCategory = category;
        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('simulator-screen').style.display = 'block';
        
        let simTitle = document.getElementById('sim-title');
        let regionText = currentRegion === 'upper' ? 'Upper Limb' : currentRegion === 'lower' ? 'Lower Limb' : currentRegion.charAt(0).toUpperCase() + currentRegion.slice(1);
        let catText = currentCategory.includes('level') ? currentCategory.replace('level', 'Level ') : currentCategory.replace('_', ' ');
        simTitle.textContent = `⚡ ${regionText}: ${catText.charAt(0).toUpperCase() + catText.slice(1)}`;
        
        generateCase(); 
    }

    function goHome() {
        document.getElementById('simulator-screen').style.display = 'none';
        document.getElementById('home-screen').style.display = 'flex';
    }

    function generateCase() {
        document.getElementById('feedback-box').style.display = 'none';
        document.getElementById('next-button').style.display = 'none';

        const templates = casesData[currentRegion][currentCategory];
        if (!templates || templates.length === 0) return;

        let templateIndex;
        if (templates.length > 1) {
            do { templateIndex = Math.floor(Math.random() * templates.length); } while (templateIndex === lastIndex);
        } else { templateIndex = 0; }
        lastIndex = templateIndex;
        let template = templates[templateIndex];

        let vignette = "";

        // DYNAMIC VIGNETTE BUILDER
        if (currentRegion === 'embryology') {
            if (currentCategory === 'level1') {
                // Early embryology (mother-focused)
                let matAge = getAge(18, 45);
                let occ = getRandom(randDict.occupations);
                let pren = getRandom(randDict.prenatal);
                vignette = `A ${matAge}-year-old female ${occ} ${pren} presents for evaluation. ${template.mechanism} On ultrasound, it is noted that it ${template.exam}`;
            } else {
                // Late embryology / Defects (infant-focused)
                let infAge = getRandom(randDict.infantAges);
                let infGender = getRandom(randDict.kidGenders);
                let matAge = getAge(18, 45);
                let delivery = getRandom(randDict.deliveries);
                let pren = getRandom(randDict.prenatal);
                let present = getRandom(randDict.presenting);
                
                vignette = `A ${infAge} ${infGender.id} born via ${delivery} to a ${matAge}-year-old mother ${pren} is evaluated ${present}. ${infGender.pro} ${template.mechanism} On examination, ${infGender.pro.toLowerCase()} ${template.exam}`;
            }
        } else {
            // Limbs and Physiology
            let age = getAge(18, 75);
            let gen = getRandom(randDict.genders);
            let occ = getRandom(randDict.occupations);
            let time = getRandom(randDict.timings);
            let setting = getRandom(randDict.settings);
            let side = getRandom(randDict.sides);
            
            let mech = template.mechanism.replace(/{pos}/g, gen.pos).replace(/{pro}/g, gen.pro).replace(/{side}/g, side);
            let ex = template.exam.replace(/{pos}/g, gen.pos).replace(/{pro}/g, gen.pro).replace(/{side}/g, side);
            
            vignette = `A ${age}-year-old ${gen.id} ${occ} presents to the clinic ${time} after ${mech} ${setting}. On examination, ${gen.pro.toLowerCase()} ${ex}`;
        }

        document.getElementById('case-text').innerHTML = `<strong>Patient File:</strong><br><br>${vignette}`;
        document.getElementById('diagnostic-text').innerHTML = `[INVESTIGATIONS]<br>${template.diagnostic}`;

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        template.options.forEach((opt, idx) => {
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt;
            btn.onclick = () => checkAnswer(idx, btn, template);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedIndex, btn, template) {
        let buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(b => b.disabled = true);
        let feedback = document.getElementById('feedback-box');
        if (selectedIndex === template.answer) {
            btn.style.background = '#27ae60'; btn.style.borderColor = '#2ecc71';
            feedback.className = 'feedback correct-feedback';
            feedback.innerHTML = `<strong>✓ Spot On.</strong><br><br>${template.explanation}`;
        } else {
            btn.style.background = '#c0392b'; btn.style.borderColor = '#e74c3c';
            buttons[template.answer].style.background = '#27ae60'; buttons[template.answer].style.borderColor = '#2ecc71';
            feedback.className = 'feedback incorrect-feedback';
            feedback.innerHTML = `<strong>✗ Incorrect Diagnosis.</strong><br><br>${template.explanation}`;
        }
        feedback.style.display = 'block';
        document.getElementById('next-button').style.display = 'block';
    }
</script>
