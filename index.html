<script>
    let currentRegion = 'upper';
    let currentCategory = 'nerves';

    // --- MASSIVE RANDOMIZATION DICTIONARIES ---
    const randDict = {
        occupations: ["software engineer", "medical student", "construction worker", "high school teacher", "professional athlete", "barista", "auto mechanic", "carpenter", "sous chef", "commercial pilot", "freelance artist", "delivery driver", "registered nurse", "farmer", "tailor", "accountant", "electrician", "paramedic", "architect", "retail manager", "photographer", "lawyer", "musician", "baker", "plumber"],
        genders: [{id: "male", pro: "He", pos: "his"}, {id: "female", pro: "She", pos: "her"}],
        kidGenders: [{id: "boy", pro: "He", pos: "his"}, {id: "girl", pro: "She", pos: "her"}],
        timings: ["just this morning", "2 hours ago", "last night", "yesterday afternoon", "2 days ago", "a few hours ago"],
        settings: ["while at work", "at home", "during a local sports match", "at the gym", "while commuting", "during a weekend trip"],
        infantAges: ["newborn", "2-day-old", "1-week-old", "1-month-old"],
        deliveries: ["normal vaginal delivery", "C-section", "prolonged labor delivery"],
        prenatal: ["with routine prenatal care", "with limited prenatal care", "who missed several ultrasound appointments"],
        presenting: ["shortly after birth", "during the first feeding", "on the second day of life", "at the first pediatric checkup", "in the neonatal ICU"],
        sides: ["right", "left"]
    };

    function getRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function getAge(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    // --- DATA BANK ---
    const casesData = {
                upper: {
                        nerves: [
                { mechanism: "falling asleep with {pos} arm draped over a park bench", exam: "demonstrates a profound 'wrist drop'. {pro} cannot extend the wrist or digits at the MCP joints. Sensory loss is noted over the posterior forearm.", diagnostic: "EMG: Denervation in brachioradialis and extensor carpi radialis. Normal signal in triceps brachii.", options: ["Radial Nerve (Spiral Groove)", "Radial Nerve (Axilla)", "Posterior Interosseous Nerve", "Median Nerve (Elbow)"], answer: 0, explanation: "Classic 'Saturday Night Palsy'. Compression in the spiral groove affects the nerve AFTER branches to the triceps have exited." },
                { mechanism: "typing for 10 straight hours at an unergonomic desk setup", exam: "reports waking up shaking {pos} hand due to burning pain in the index and middle fingers. Sensation over the thenar eminence is preserved.", diagnostic: "NCV: Prolonged distal latency across the flexor retinaculum.", options: ["Pronator Teres Syndrome", "C6 Radiculopathy", "Ulnar Tunnel Syndrome", "Carpal Tunnel Syndrome"], answer: 3, explanation: "Carpal Tunnel Syndrome affects the median nerve. The palmar cutaneous branch passes OVER the flexor retinaculum, sparing sensation to the thumb base." },
                { mechanism: "sustaining a severe fracture to the medial epicondyle of the humerus after a fall", exam: "presents with numbness over the pinky finger and medial half of the ring finger. {pro} struggles to hold a piece of paper between {pos} fingers.", diagnostic: "Physical Exam: Positive Froment's sign and clawing of the 4th and 5th digits at rest.", options: ["Ulnar Nerve Injury", "Median Nerve Injury", "Radial Nerve Injury", "Musculocutaneous Nerve Injury"], answer: 0, explanation: "The ulnar nerve runs directly posterior to the medial epicondyle (cubital tunnel) and supplies intrinsic hand muscles and sensation to the medial 1.5 digits." },
                { mechanism: "dislocating {pos} shoulder anteriorly", exam: "shows flattening of the shoulder contour and loss of sensation over the lateral aspect of the upper arm.", diagnostic: "X-Ray: Anterior dislocation. Physical Exam: Weakness in shoulder abduction beyond 15 degrees.", options: ["Suprascapular Nerve", "Thoracodorsal Nerve", "Axillary Nerve", "Long Thoracic Nerve"], answer: 2, explanation: "The axillary nerve wraps around the surgical neck of the humerus and is highly susceptible to injury during anterior shoulder dislocations." },
                { mechanism: "experiencing deep laceration across the anterior wrist crease", exam: "presents with inability to oppose the thumb to the little finger ('Ape hand' deformity) and loss of sensation over the lateral 3.5 digits on the palmar side.", diagnostic: "Surgical exploration: Complete transection of nerve trunk deep to flexor retinaculum.", options: ["Ulnar Nerve", "Radial Nerve", "Median Nerve", "Anterior Interosseous Nerve"], answer: 2, explanation: "Median nerve laceration at the wrist causes loss of thenar opposition and sensory deficit in the lateral 3.5 digits." },
                { mechanism: "falling onto the shoulder with the head forced to the opposite side (Erb-Duchenne palsy mechanism)", exam: "presents with the arm adducted, medially rotated, and forearm pronated ('Waiter's tip' position).", diagnostic: "Physical Exam: Absence of Moro reflex on the affected side in an infant.", options: ["Upper Trunk Brachial Plexus (C5-C6)", "Lower Trunk Brachial Plexus (C8-T1)", "Entire Brachial Plexus", "Axillary Nerve Isolated"], answer: 0, explanation: "Erb's palsy involves upper trunk (C5-C6) roots, paralyzing shoulder abductors and lateral rotators." },
                { mechanism: "grabbing a tree branch to break a fall from a height (Klumpke palsy mechanism)", exam: "presents with a total 'claw hand' and complete loss of intrinsic hand muscles. Horner's syndrome may be present.", diagnostic: "Physical Exam: Sensory loss along the medial side of the arm and forearm.", options: ["Upper Trunk Brachial Plexus", "Lower Trunk Brachial Plexus (C8-T1)", "Radial Nerve", "Musculocutaneous Nerve"], answer: 1, explanation: "Klumpke's palsy involves lower trunk (C8-T1) roots, affecting intrinsic hand muscles and sympathetic fibers." },
                { mechanism: "undergoing prolonged shoulder arthroscopy in the lateral decubitus position", exam: "complains of deep, dull, aching pain over the posterior shoulder and weakness in external rotation.", diagnostic: "MRI: Denervation confined strictly to the infraspinatus and supraspinatus muscles.", options: ["Suprascapular Nerve", "Axillary Nerve", "Long Thoracic Nerve", "Radial Nerve"], answer: 0, explanation: "The suprascapular nerve passes through the suprascapular notch and can be entrapped or injured during positioning." },
                { mechanism: "sustaining a deep stab wound in the mid-arm region", exam: "presents with inability to flex the elbow and loss of sensation over the lateral aspect of the forearm.", diagnostic: "Physical Exam: Weakness when attempting to supinate a flexed forearm.", options: ["Musculocutaneous Nerve", "Radial Nerve", "Median Nerve", "Axillary Nerve"], answer: 0, explanation: "Musculocutaneous nerve innervates the anterior arm compartment and continues as the lateral cutaneous nerve of the forearm." },
                { mechanism: "experiencing repetitive pronation and supination motions during industrial assembly work", exam: "reports deep aching pain in the proximal volar forearm with weakness in pinching the thumb and index finger, but NO sensory deficits in the hand.", diagnostic: "EMG: Denervation of flexor pollicis longus and flexor digitorum profundus (lateral part).", options: ["Anterior Interosseous Nerve (AIN) Syndrome", "Carpal Tunnel Syndrome", "Pronator Teres Syndrome", "Ulnar Tunnel Syndrome"], answer: 0, explanation: "AIN syndrome is a pure motor branch of the median nerve; patients cannot make the 'OK' sign (pinch sign)." },
                { mechanism: "leaning heavily on crutches improperly for several weeks", exam: "presents with bilateral weakness in shoulder abduction, arm extension, and a localized sensory deficit over the posterior arm and dorsal hand.", diagnostic: "NCV: Conduction block localized to the posterior cord of the brachial plexus.", options: ["Posterior Cord Brachial Plexus Injury", "Lateral Cord Injury", "Medial Cord Injury", "Lower Trunk Injury"], answer: 0, explanation: "Crutch palsy can compress the posterior cord, affecting both radial and axillary nerve distributions." },
                { mechanism: "undergoing a poorly executed surgical dissection in the axillary space", exam: "presents with loss of cutaneous sensation on the medial side of the upper arm, alongside classical ulnar nerve motor findings.", diagnostic: "Physical Exam: Deficit in medial brachial cutaneous nerve function.", options: ["Medial Cord Brachial Plexus Injury", "Upper Trunk Injury", "Posterior Cord Injury", "Radial Nerve Injury"], answer: 0, explanation: "The medial cord gives rise to the ulnar nerve and the medial cutaneous nerves of the arm and forearm." },
                { mechanism: "experiencing severe hyperabduction of the arm during athletic training", exam: "presents with weakness in forearm pronation and sensory abnormalities across the lateral palm and thenar aspect.", diagnostic: "NCV: Compression or traction injury at the level of cords before branch separation.", options: ["Lateral Cord Brachial Plexus Injury", "Posterior Cord Injury", "Radial Nerve Injury", "Axillary Nerve Injury"], answer: 0, explanation: "Lateral cord lesions affect components of the musculational and median nerves." },
                { mechanism: "suffering a direct crushing injury to the medial epicondyle groove", exam: "presents with progressive wasting of the hypothenar eminence and interosseous spaces.", diagnostic: "EMG: Chronic neurogenic changes restricted strictly to ulnar-innervated intrinsic hand muscles.", options: ["Chronic Cubital Tunnel Syndrome", "Acute Ulnar Laceration", "Guyon Canal Syndrome", "Medial Epicondylitis"], answer: 0, explanation: "Chronic compression at the elbow leads to denervation and noticeable atrophy of intrinsic hand muscles." },
                { mechanism: "riding a bicycle long distances with handlebars exerting direct pressure on the wrist", exam: "presents with clumsiness in handling small objects, weak finger abduction/adduction, but normal dorsal sensation over the hypothenar area.", diagnostic: "NCV: Impaired conduction specifically across the pisohamate hiatus.", options: ["Guyon's Canal Syndrome", "Cubital Tunnel Syndrome", "Carpal Tunnel Syndrome", "Pronator Teres Syndrome"], answer: 0, explanation: "Guyon's canal syndrome traps the ulnar nerve at the wrist; the dorsal cutaneous branch branches off proximal to the wrist, sparing dorsal sensation." },
                { mechanism: "experiencing an entrapment of the median nerve between the two heads of a forearm muscle", exam: "reports vague aching pain over the proximal anterior forearm and pain elicited by resisted pronation.", diagnostic: "EMG: Normal AIN function, but abnormalities in superficial median-innervated flexors. Positive Tinel sign at the elbow.", options: ["Pronator Teres Syndrome", "Carpal Tunnel Syndrome", "AIN Syndrome", "Cubital Tunnel Syndrome"], answer: 0, explanation: "Pronator Teres syndrome involves median nerve compression between the humeral and ulnar heads of the pronator teres muscle." },
                { mechanism: "sustaining a fracture of the shaft of the humerus (spiral fracture)", exam: "presents with inability to extend the wrist and loss of the triceps reflex if proximal, but triceps strength remains intact.", diagnostic: "X-Ray: Spiral fracture of the middle third of the humeral shaft.", options: ["Radial Nerve Palsy (Midshaft)", "High Radial Nerve Palsy", "PIN Syndrome", "Axillary Nerve Injury"], answer: 0, explanation: "Midshaft humeral fractures commonly damage the radial nerve as it traverses the spiral groove." },
                { mechanism: "undergoing repetitive wrist extension and heavy tool use (tennis player or mechanic)", exam: "complains of vague dorsal forearm pain mimicking tennis elbow, but resistant to standard epicondylitis treatments. No motor drop yet.", diagnostic: "EMG: Compression of a deep branch passing through the arcade of Frohse.", options: ["Posterior Interosseous Nerve (PIN) Syndrome", "Radial Tunnel Syndrome", "Lateral Epicondylitis", "De Quervain Tenosynovitis"], answer: 1, explanation: "Radial tunnel syndrome causes pain without motor loss, whereas PIN syndrome causes distinct motor weakness (finger drop)." },
                { mechanism: "presenting with complete inability to extend the fingers at the MCP joints and thumb extension weakness, but normal wrist extension", exam: "reports no sensory loss over the dorsal hand.", diagnostic: "Surgical finding: Entrapment or compression of the motor branch of the radial nerve beneath the supinator muscle.", options: ["Posterior Interosseous Nerve (PIN) Syndrome", "Radial Tunnel Syndrome", "Saturday Night Palsy", "High Radial Nerve Injury"], answer: 0, explanation: "PIN is the motor branch of the radial nerve; its compression causes finger drop and weak thumb extension without wrist drop." },
                { mechanism: "sustaining a severe penetrating injury to the posterior triangle of the neck", exam: "presents with inability to shrug the {side} shoulder and weakness in turning the head to the opposite side.", diagnostic: "Physical Exam: Atrophy and weakness of the trapezius and sternocleidomastoid muscles.", options: ["Spinal Accessory Nerve (CN XI)", "Long Thoracic Nerve", "Suprascapular Nerve", "Dorsal Scapular Nerve"], answer: 0, explanation: "The spinal accessory nerve runs superficially through the posterior triangle, making it vulnerable to neck trauma and biopsy." },
                { mechanism: "experiencing deep muscular strain and postural stress affecting the interscapular region", exam: "presents with mild winging of the scapula and lateral displacement of the scapula away from the midline.", diagnostic: "EMG: Denervation localized strictly to the rhomboid major, rhomboid minor, and levator scapulae muscles.", options: ["Dorsal Scapular Nerve Injury", "Long Thoracic Nerve Injury", "Spinal Accessory Nerve Injury", "Thoracodorsal Nerve Injury"], answer: 0, explanation: "The dorsal scapular nerve originates from C5 root and innervates the rhomboids and levator scapulae." },
                { mechanism: "undergoing radical axillary lymph node dissection for breast malignancy", exam: "presents with weakness in extending, adducting, and medially rotating the arm.", diagnostic: "EMG: Denervation of the latissimus dorsi muscle.", options: ["Thoracodorsal Nerve Injury", "Long Thoracic Nerve Injury", "Medial Pectoral Nerve Injury", "Axillary Nerve Injury"], answer: 0, explanation: "The thoracodorsal nerve runs along the posterior axillary wall to supply the latissimus dorsi." },
                { mechanism: "experiencing blunt trauma to the pectoral region during a contact sports collision", exam: "presents with weakness in arm adduction and internal rotation, accompanied by partial atrophy of the chest wall.", diagnostic: "EMG: Involvement of both medial and lateral pectoral nerves.", options: ["Pectoral Nerve Injury", "Thoracodorsal Injury", "Intercostobrachial Neuralgia", "Long Thoracic Injury"], answer: 0, explanation: "Pectoral nerves supply the pectoralis major and minor muscles, crucial for arm adduction and internal rotation." },
                { mechanism: "presenting with burning neuropathic pain and sensory loss along the inner arm following axillary surgery", exam: "reports altered sensation in the axilla and medial upper arm.", diagnostic: "Clinical Exam: Isolated cutaneous sensory loss with preserved motor function in all limb muscles.", options: ["Intercostobrachial Nerve Injury", "Medial Brachial Cutaneous Injury", "Ulnar Nerve Injury", "Medial Cord Injury"], answer: 0, explanation: "The intercostobrachial nerve (T2 lateral cutaneous branch) is frequently encountered and injured during axillary lymph node procedures." },
                { mechanism: "suffering a high-velocity motorcycle accident with severe traction on the ipsilateral arm", exam: "presents with a completely flail, anesthetic, and paralyzed upper limb with absent deep tendon reflexes.", diagnostic: "MRI Myelography: Nerve root avulsions exiting the cervical spinal cord.", options: ["Complete Brachial Plexus Avulsion", "Erb's Palsy", "Klumpke's Palsy", "Upper Trunk Injury"], answer: 0, explanation: "Pan-plexus avulsion results in a completely dead, flail arm often requiring complex nerve grafting or amputation." },
                { mechanism: "presenting with localized neuralgic amyotrophy (Parsonage-Turner syndrome) following a viral illness", exam: "reports sudden severe shoulder and arm pain followed rapidly by profound muscle wasting and weakness of the shoulder girdle.", diagnostic: "EMG: Multifocal denervation across multiple peripheral nerve distributions.", options: ["Neuralgic Amyotrophy (Parsonage-Turner)", "C5 Radiculopathy", "Rotator Cuff Tear", "Frozen Shoulder"], answer: 0, explanation: "Parsonage-Turner syndrome is an idiopathic immune-mediated plexus neuritis characterized by sudden pain followed by atrophy." },
                { mechanism: "experiencing chronic cervical disc herniation at the C5-C6 level", exam: "presents with pain radiating down the lateral arm, numbness in the thumb, and a diminished biceps reflex.", diagnostic: "MRI Cervical Spine: Herniated disc compressing the exiting C6 nerve root.", options: ["C6 Radiculopathy", "C7 Radiculopathy", "C8 Radiculopathy", "Median Nerve Entrapment"], answer: 0, explanation: "C6 radiculopathy causes lateral arm pain, thumb paresthesia, and weak biceps/brachioradialis reflexes." },
                { mechanism: "suffering a cervical spine injury affecting the C7 nerve root", exam: "presents with pain radiating to the middle finger, weakness in triceps extension, and a diminished triceps reflex.", diagnostic: "MRI: Disc protrusion at the C6-C7 level.", options: ["C7 Radiculopathy", "C6 Radiculopathy", "C8 Radiculopathy", "Radial Nerve Palsy"], answer: 0, explanation: "C7 is the most common cervical radiculopathy, affecting the middle finger, triceps, and wrist flexors/extensors." },
                { mechanism: "presenting with weakness in finger flexion and intrinsic hand muscles with sensory loss over the medial hand and forearm", exam: "MRI shows degenerative changes compressing the C8 root.", diagnostic: "EMG: Findings consistent with lower cervical root involvement.", options: ["C8 Radiculopathy", "T1 Radiculopathy", "Klumpke Palsy", "Ulnar Neuropathy"], answer: 0, explanation: "C8 radiculopathy affects finger flexors and intrinsic muscles, mimicking lower trunk or ulnar lesions." },
                { mechanism: "experiencing a Pancoast tumor (superior sulcus tumor) of the lung apex", exam: "presents with Horner's syndrome (ptosis, miosis, anhidrosis), shoulder pain, and weakness of intrinsic hand muscles.", diagnostic: "Chest CT: Mass at the superior pulmonary sulcus invading the lower brachial plexus.", options: ["Pancoast Syndrome (Lower Brachial Plexus / Sympathetic Chain)", "Erb's Palsy", "C6 Radiculopathy", "Thoracic Outlet Syndrome"], answer: 0, explanation: "Pancoast tumors invade the lower trunk of the brachial plexus and the cervical sympathetic chain." },

                { mechanism: "sustaining a severe twisting injury to the knee resulting in a locked knee", exam: "joint line tenderness, knee locked in 30 degrees of flexion, and a positive McMurray test.", options: ["Meniscal Tear (Bucket Handle)", "Popliteus Muscle Rupture", "Patellar Dislocation", "ACL Tear"], answer: 0, explanation: "While not a primary muscle injury, a bucket-handle meniscal tear mechanically blocks the joint, distinguishing it from purely muscular causes of inability to extend the knee." },

    let lastIndex = -1;

    function launchSimulator(region, category) {
        currentRegion = region;
        currentCategory = category;
        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('simulator-screen').style.display = 'block';
        
        let simTitle = document.getElementById('sim-title');
        let regionText = currentRegion === 'upper' ? 'Upper Limb' : currentRegion === 'lower' ? 'Lower Limb' : currentRegion.charAt(0).toUpperCase() + currentRegion.slice(1);
        let catText = currentCategory.includes('level') ? currentCategory.replace('level', 'Level ') : currentCategory.replace('_', ' ');
        simTitle.textContent = `⚡ ${regionText}: ${catText.charAt(0).toUpperCase() + catText.slice(1)}`;
        
        generateCase(); 
    }

    function goHome() {
        document.getElementById('simulator-screen').style.display = 'none';
        document.getElementById('home-screen').style.display = 'flex';
    }

    function generateCase() {
        document.getElementById('feedback-box').style.display = 'none';
        document.getElementById('next-button').style.display = 'none';

        const templates = casesData[currentRegion][currentCategory];
        if (!templates || templates.length === 0) return;

        let templateIndex;
        if (templates.length > 1) {
            do { templateIndex = Math.floor(Math.random() * templates.length); } while (templateIndex === lastIndex);
        } else { templateIndex = 0; }
        lastIndex = templateIndex;
        let template = templates[templateIndex];

        let vignette = "";

        // DYNAMIC VIGNETTE BUILDER
        if (currentRegion === 'embryology') {
            if (currentCategory === 'level1') {
                // Early embryology (mother-focused)
                let matAge = getAge(18, 45);
                let occ = getRandom(randDict.occupations);
                let pren = getRandom(randDict.prenatal);
                vignette = `A ${matAge}-year-old female ${occ} ${pren} presents for evaluation. ${template.mechanism} On ultrasound, it is noted that it ${template.exam}`;
            } else {
                // Late embryology / Defects (infant-focused)
                let infAge = getRandom(randDict.infantAges);
                let infGender = getRandom(randDict.kidGenders);
                let matAge = getAge(18, 45);
                let delivery = getRandom(randDict.deliveries);
                let pren = getRandom(randDict.prenatal);
                let present = getRandom(randDict.presenting);
                
                vignette = `A ${infAge} ${infGender.id} born via ${delivery} to a ${matAge}-year-old mother ${pren} is evaluated ${present}. ${infGender.pro} ${template.mechanism} On examination, ${infGender.pro.toLowerCase()} ${template.exam}`;
            }
        } else {
            // Limbs and Physiology
            let age = getAge(18, 75);
            let gen = getRandom(randDict.genders);
            let occ = getRandom(randDict.occupations);
            let time = getRandom(randDict.timings);
            let setting = getRandom(randDict.settings);
            let side = getRandom(randDict.sides);
            
            let mech = template.mechanism.replace(/{pos}/g, gen.pos).replace(/{pro}/g, gen.pro).replace(/{side}/g, side);
            let ex = template.exam.replace(/{pos}/g, gen.pos).replace(/{pro}/g, gen.pro).replace(/{side}/g, side);
            
            vignette = `A ${age}-year-old ${gen.id} ${occ} presents to the clinic ${time} after ${mech} ${setting}. On examination, ${gen.pro.toLowerCase()} ${ex}`;
        }

        document.getElementById('case-text').innerHTML = `<strong>Patient File:</strong><br><br>${vignette}`;
        document.getElementById('diagnostic-text').innerHTML = `[INVESTIGATIONS]<br>${template.diagnostic}`;

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        template.options.forEach((opt, idx) => {
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt;
            btn.onclick = () => checkAnswer(idx, btn, template);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedIndex, btn, template) {
        let buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(b => b.disabled = true);
        let feedback = document.getElementById('feedback-box');
        if (selectedIndex === template.answer) {
            btn.style.background = '#27ae60'; btn.style.borderColor = '#2ecc71';
            feedback.className = 'feedback correct-feedback';
            feedback.innerHTML = `<strong>✓ Spot On.</strong><br><br>${template.explanation}`;
        } else {
            btn.style.background = '#c0392b'; btn.style.borderColor = '#e74c3c';
            buttons[template.answer].style.background = '#27ae60'; buttons[template.answer].style.borderColor = '#2ecc71';
            feedback.className = 'feedback incorrect-feedback';
            feedback.innerHTML = `<strong>✗ Incorrect Diagnosis.</strong><br><br>${template.explanation}`;
        }
        feedback.style.display = 'block';
        document.getElementById('next-button').style.display = 'block';
    }
