    let lastIndex = -1;

    function launchSimulator(region, category) {
        currentRegion = region;
        currentCategory = category;
        
        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('simulator-screen').style.display = 'block';
        
        const simTitle = document.getElementById('sim-title');
        let regionText = '';
        if (region === 'upper') regionText = 'Upper Limb';
        else if (region === 'lower') regionText = 'Lower Limb';
        else if (region === 'embryology') regionText = 'Embryology';
        else if (region === 'physiology') regionText = 'Physiology';

        let categoryText = '';
        if (region === 'embryology') {
            categoryText = `Level ${category.replace('level', '')}`;
        } else if (region === 'physiology') {
            if (category === 'body_fluids') categoryText = 'Body Fluids & Blood';
            else if (category === 'nervous_muscular') categoryText = 'Nervous & Muscular';
            else if (category === 'immune') categoryText = 'Immune System';
        } else {
            if (category === 'limbs') categoryText = 'Limb Development';
            else categoryText = category.charAt(0).toUpperCase() + category.slice(1) + ' Injuries';
        }
        
        simTitle.textContent = `⚡ ${regionText}: ${categoryText}`;
        
        generateCase(); 
    }

    function goHome() {
        document.getElementById('simulator-screen').style.display = 'none';
        document.getElementById('home-screen').style.display = 'flex';
    }

    function generateCase() {
        document.getElementById('feedback-box').style.display = 'none';
        document.getElementById('next-button').style.display = 'none';

        const templates = casesData[currentRegion][currentCategory];

        if (!templates || templates.length === 0) {
            document.getElementById('case-text').innerHTML = `<strong>Notice:</strong><br><br>More cases are coming soon to this section!`;
            document.getElementById('diagnostic-text').innerHTML = `[INVESTIGATIONS PENDING]`;
            document.getElementById('options-container').innerHTML = '';
            return;
        }

        let templateIndex;
        if (templates.length > 1) {
            do {
                templateIndex = Math.floor(Math.random() * templates.length);
            } while (templateIndex === lastIndex);
        } else {
            templateIndex = 0;
        }
        lastIndex = templateIndex;
        
        let template = templates[templateIndex];

        let vignette = "";
        if (currentRegion === 'embryology' || currentRegion === 'physiology') {
            vignette = `A patient ${template.mechanism}. On examination, ${template.exam}`;
        } else {
            let age = Math.floor(Math.random() * 52) + 18;
            let genderObj = genders[Math.floor(Math.random() * genders.length)];
            let occupation = occupations[Math.floor(Math.random() * occupations.length)];
            let side = sides[Math.floor(Math.random() * sides.length)];
            vignette = `A ${age}-year-old ${genderObj.id} ${occupation} ${template.mechanism}. On examination, ${genderObj.pro.toLowerCase()} ${template.exam}`;
            vignette = vignette.replace(/{pro}/g, genderObj.pro).replace(/{pos}/g, genderObj.pos).replace(/{side}/g, side);
        }

        document.getElementById('case-text').innerHTML = `<strong>Patient File:</strong><br><br>${vignette}`;
        document.getElementById('diagnostic-text').innerHTML = `[INVESTIGATIONS]<br>${template.diagnostic}`;

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        template.options.forEach((opt, idx) => {
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt;
            btn.onclick = () => checkAnswer(idx, btn, template);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedIndex, btn, template) {
        let buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(b => b.disabled = true);
        
        let feedback = document.getElementById('feedback-box');
        
        if (selectedIndex === template.answer) {
            btn.style.background = '#27ae60';
            btn.style.borderColor = '#2ecc71';
            feedback.className = 'feedback correct-feedback';
            feedback.innerHTML = `<strong>✓ Spot On.</strong><br><br>${template.explanation}`;
        } else {
            btn.style.background = '#c0392b';
            btn.style.borderColor = '#e74c3c';
            buttons[template.answer].style.background = '#27ae60';
            buttons[template.answer].style.borderColor = '#2ecc71';
            feedback.className = 'feedback incorrect-feedback';
            feedback.innerHTML = `<strong>✗ Incorrect Diagnosis.</strong><br><br>${template.explanation}`;
        }
        
        feedback.style.display = 'block';
        document.getElementById('next-button').style.display = 'block';
    }
