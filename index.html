<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yazan's PBL Simulator</title>
    <link rel="icon" type="image/png" href="./logo.png">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            background-image: url("data:image/svg+xml,%3Csvg width='200' height='200' viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cg stroke='%233498db' stroke-width='1.5' fill='none' stroke-opacity='0.08'%3E%3Cpolyline points='20,160 40,160 50,130 65,180 85,120 100,160 120,160' stroke-linejoin='round' /%3E%3Cpath d='M150,40 h10 v-10 h10 v10 h10 v10 h-10 v10 h-10 v-10 h-10 z' fill='%233498db' fill-opacity='0.03' /%3E%3Ccircle cx='50' cy='50' r='8' /%3E%3Cpath d='M50,58 v20 M44,44 l-12,-12 M56,44 l12,-12 M58,50 h15' stroke-linecap='round' /%3E%3C/g%3E%3C/svg%3E");
            background-size: 250px 250px;
            color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* --- HOME SCREEN STYLES --- */
        #home-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 2rem;
            box-sizing: border-box;
        }
        .top-header-area {
            text-align: center;
            margin-bottom: 2rem;
        }
        .welcome-text {
            font-size: 1.2rem;
            color: #8c9ba5;
            margin-bottom: 5px;
            letter-spacing: 1px;
            text-transform: lowercase;
        }
        .main-title {
            font-size: 3rem;
            color: #3498db;
            margin: 0;
            letter-spacing: 2px;
        }
        
        /* Layout for Columns */
        .limbs-container {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 1250px;
            justify-content: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .limb-column {
            flex: 1;
            min-width: 250px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(45, 45, 45, 0.6);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #444;
        }
        .limb-column h2 {
            text-align: center;
            color: #fff;
            margin-top: 0;
            margin-bottom: 10px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
            font-size: 1.3rem;
        }

        .start-box {
            background: #2d2d2d;
            border: 2px solid #3498db;
            color: #f0f2f5;
            padding: 10px 12px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        .start-box:hover {
            background: #3498db;
            color: #fff;
            transform: scale(1.03);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }
        
        .footer-area {
            text-align: center;
            margin-top: 1rem;
        }
        .contact-badge {
            display: inline-flex;
            align-items: center;
            background: #2d2d2d;
            border: 1px solid #3498db;
            color: #3498db;
            padding: 10px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }
        .contact-badge:hover {
            background: #3498db;
            color: #fff;
        }
        .contact-badge svg {
            margin-right: 8px;
            width: 16px;
            height: 16px;
        }

        /* --- SIMULATOR SCREEN STYLES --- */
        .simulator-container {
            background: #2d2d2d;
            max-width: 900px;
            width: 100%;
            padding: 3.5rem 2.5rem 2.5rem 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none; 
            position: relative;
        }
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: transparent;
            border: none;
            color: #8c9ba5;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: color 0.2s;
            padding: 0;
        }
        .back-btn:hover { color: #3498db; }
        .back-btn svg { width: 20px; height: 20px; margin-right: 6px; }

        .sim-header {
            color: #fff;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-top: 0;
            font-size: 1.8rem;
        }
        .clinical-history {
            background: #3d3d3d;
            padding: 20px;
            border-left: 5px solid #3498db;
            margin-bottom: 20px;
            font-size: 1.15rem;
            line-height: 1.6;
            border-radius: 0 8px 8px 0;
        }
        .diagnostic-viewer {
            background: #000;
            color: #4af626;
            padding: 25px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1rem;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid #555;
            line-height: 1.5;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        button.option-btn {
            background: #444;
            border: 2px solid #555;
            color: #fff;
            padding: 15px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        button.option-btn:hover { background: #3498db; border-color: #3498db; }
        button.option-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .feedback {
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 1.1rem;
            line-height: 1.6;
        }
        .correct-feedback { background: rgba(39, 174, 96, 0.2); color: #2ecc71; border: 1px solid #27ae60; }
        .incorrect-feedback { background: rgba(231, 76, 60, 0.2); color: #e74c3c; border: 1px solid #c0392b; }
        
        .next-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 15px 24px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: none;
            width: 100%;
            transition: background 0.2s;
        }
        .next-btn:hover { background: #2980b9; }

        @media (max-width: 768px) {
            .options-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- HOME SCREEN -->
    <div id="home-screen">
        <div class="top-header-area">
            <div class="welcome-text">welcome to</div>
            <h1 class="main-title">Yazan's PBL Simulator</h1>
        </div>
        
        <div class="limbs-container">
            <!-- Upper Limb Column -->
            <div class="limb-column">
                <h2>Upper Limb</h2>
                <button class="start-box" onclick="launchSimulator('upper', 'nerves')">Nerves Injuries</button>
                <button class="start-box" onclick="launchSimulator('upper', 'muscles')">Muscles Injuries</button>

            </div>

            <!-- Lower Limb Column -->
            <div class="limb-column">

                <button class="start-box" onclick="launchSimulator('lower', 'nerves')">Nerves Injuries</button>
                <button class="start-box" onclick="launchSimulator('lower', 'muscles')">Muscles Injuries</button>
                <button class="start-box" onclick="launchSimulator('lower', 'bones')">Bone Injuries</button>
                <button class="start-box" onclick="launchSimulator('lower', 'general')">General Injuries</button>

            <!-- Embryology Column -->
            <div class="limb-column">

                <button class="start-box" onclick="launchSimulator('embryology', 'level2')">Level 2: Organogenesis</button>
                <button class="start-box" onclick="launchSimulator('embryology', 'level3')">Level 3: Structural Defects</button>
                <button class="start-box" onclick="launchSimulator('embryology', 'level4')">Level 4: Advanced Pathology</button>

            <!-- Physiology Column (NEW) -->
            <div class="limb-column">
                <h2>Physiology</h2>
                <button class="start-box" onclick="launchSimulator('physiology', 'body_fluids')">Body Fluids & Blood</button>
                <button class="start-box" onclick="launchSimulator('physiology', 'nervous_muscular')">Nervous & Muscular</button>
                <button class="start-box" onclick="launchSimulator('physiology', 'immune')">Immune System</button>
            </div>
        </div>
        
        <div class="footer-area">
            <a href="mailto:yazan.w.q7@icloud.com" class="contact-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
                Contact Me
            </a>
        </div>
    </div>

    <!-- SIMULATOR SCREEN -->
    <div id="simulator-screen" class="simulator-container">
        <button class="back-btn" onclick="goHome()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back
        </button>

        <h2 id="sim-title" class="sim-header">⚡ Clinical PBL Simulator</h2>
        
        <div id="case-text" class="clinical-history"></div>
        <div id="diagnostic-text" class="diagnostic-viewer"></div>
        <div id="options-container" class="options-grid"></div>
        <div id="feedback-box" class="feedback"></div>

        <button id="next-button" class="next-btn" onclick="generateCase()">Load Next Case</button>
    </div>

<script>
    let currentRegion = 'upper';
    let currentCategory = 'nerves';

    const occupations = ["software engineer", "medical student", "construction worker", "teacher", "professional athlete", "barista", "mechanic", "carpenter"];
    const sides = ["right", "left"];
    const genders = [{id: "male", pro: "He", pos: "his"}, {id: "female", pro: "She", pos: "her"}];

    // ALL CLINICAL CASES ORGANIZED BY REGION AND CATEGORY
    const casesData = {
        upper: {
            nerves: [
                {
                    mechanism: "fell asleep with {pos} arm draped over a park bench after a party",
                    exam: "demonstrates a profound 'wrist drop'. {pro} cannot extend the wrist or digits at the MCP joints. Sensory loss is noted over the posterior forearm and dorsal hand. Triceps reflex is completely normal.",
                    diagnostic: "EMG: Denervation in brachioradialis and extensor carpi radialis longus. Normal signal in triceps brachii.",
                    options: ["Radial Nerve (Spiral Groove)", "Radial Nerve (Axilla)", "Posterior Interosseous Nerve", "Median Nerve (Elbow)"],
                    answer: 0,
                    explanation: "Classic 'Saturday Night Palsy'. Compression in the spiral groove affects the nerve AFTER the branches to the triceps have exited."
                },
                {
                    mechanism: "works long shifts typing at an unergonomic desk setup",
                    exam: "reports waking up at night shaking {pos} hand due to burning pain in the index and middle fingers. Sensation over the thenar eminence is preserved.",
                    diagnostic: "NCV: Prolonged distal latency across the flexor retinaculum.",
                    options: ["Pronator Teres Syndrome", "C6 Radiculopathy", "Ulnar Tunnel Syndrome", "Carpal Tunnel Syndrome"],
                    answer: 3,
                    explanation: "Classic Carpal Tunnel Syndrome. The palmar cutaneous branch passes OVER the flexor retinaculum, so sensation to the base of the thumb is spared."
                }
            ],
            muscles: [
                {
                    mechanism: "heard a loud 'pop' while attempting a heavy deadlift at the gym",
                    exam: "complains of sudden anterior elbow pain. Physical exam reveals a prominent bulge in the distal anterior arm ('Popeye muscle') and weak forearm supination.",
                    diagnostic: "Ultrasound/MRI: Complete retraction of a tendon belly in the anterior compartment of the arm.",
                    options: ["Distal Biceps Tendon Rupture", "Proximal Biceps Long Head Tendon Rupture", "Brachialis Muscle Tear", "Triceps Tendon Avulsion"],
                    answer: 1,
                    explanation: "Biceps long head rupture yields the characteristic 'Popeye' deformity."
                }
            ],
            bones: [
                {
                    mechanism: "fell on an outstretched hand (FOOSH) during a snowboarding accident",
                    exam: "presents with severe tenderness specifically in the anatomical snuffbox. X-rays taken on the day of the injury appear completely normal.",
                    diagnostic: "MRI (Day 3): Shows a fine radiolucent line across the waist of a proximal carpal bone.",
                    options: ["Lunate Dislocation", "Scaphoid Fracture", "Colles Fracture", "Trapezium Fracture"],
                    answer: 1,
                    explanation: "Scaphoid fractures classically present with snuffbox tenderness and require careful imaging to prevent avascular necrosis."
                }
            ],
            general: [
                {
                    mechanism: "was tackled aggressively from behind during a rugby match",
                    exam: "is holding the arm slightly abducted and externally rotated. The lateral shoulder appears 'squared off' rather than rounded.",
                    diagnostic: "X-Ray: The humeral head lies inferior and medial to the glenoid fossa.",
                    options: ["Posterior Shoulder Dislocation", "Acromioclavicular Joint Separation", "Anterior Shoulder Dislocation", "Clavicle Fracture"],
                    answer: 2,
                    explanation: "Anterior shoulder dislocation is the most common joint dislocation, presenting with a 'squared off' shoulder appearance."
                }
            ]
        },
        lower: {
            nerves: [
                {
                    mechanism: "woke up with a distinct 'foot drop' and steppage gait after wearing a tight knee brace",
                    exam: "{pro} cannot dorsiflex or evert the foot. Sensory loss is present on the anterolateral lower leg and dorsum of the foot.",
                    diagnostic: "NCV: Conduction block at the lateral aspect of the knee. Normal plantarflexion and inversion strength.",
                    options: ["Tibial Nerve", "Deep Peroneal Nerve", "Common Peroneal Nerve", "Superficial Peroneal Nerve"],
                    answer: 2,
                    explanation: "Common Peroneal nerve wraps around the neck of the fibula, making it vulnerable to compression."
                }
            ],
            muscles: [
                {
                    mechanism: "felt a sudden sharp 'snap' in the lower calf while pushing off forcefully during tennis",
                    exam: "is unable to plantarflex the foot. Thompson squeeze test is positive. A palpable defect is present.",
                    diagnostic: "Ultrasound: Full-thickness gap in a large tendon 4 cm proximal to the calcaneal insertion.",
                    options: ["Gastrocnemius Muscle Strain", "Achilles Tendon Rupture", "Plantaris Tendon Rupture", "Tibial Nerve Injury"],
                    answer: 1,
                    explanation: "Achilles tendon rupture is marked by a palpable gap and a positive Thompson squeeze test."
                }
            ],
            bones: [
                {
                    mechanism: "is an elderly patient who slipped on a wet bathroom floor",
                    exam: "The {side} leg appears shortened and is prominently externally rotated. {pro} is unable to bear any weight.",
                    diagnostic: "X-Ray: Disruption of the bony trabeculae just distal to the femoral head.",
                    options: ["Intertrochanteric Fracture", "Femoral Shaft Fracture", "Femoral Neck Fracture", "Posterior Hip Dislocation"],
                    answer: 2,
                    explanation: "A shortened and externally rotated leg after a fall is classic for a femoral neck or hip fracture."
                }
            ],
            general: [
                {
                    mechanism: "was pivoting rapidly to change direction in a football match when {pos} knee buckled with a loud 'pop'",
                    exam: "The knee became severely swollen within 2 hours. The Lachman test is strongly positive.",
                    diagnostic: "MRI: Complete mid-substance tear of a major stabilizing intra-articular ligament.",
                    options: ["MCL Tear", "PCL Tear", "Medial Meniscus Tear", "ACL Tear"],
                    answer: 3,
                    explanation: "ACL tears classically present with a 'pop', rapid swelling, and a positive Lachman test."
                }
            ]
        },
        embryology: {
            level1: [
                {
                    mechanism: "undergoes normal fertilization and early cleavage divisions in the fallopian tube",
                    exam: "reaches the uterine cavity as a solid ball of cells approximately 3 days post-fertilization.",
                    diagnostic: "Histology: Outer layer of blastomeres forming tight junctions with an inner cell mass.",
                    options: ["Morula", "Blastocyst", "Zygote", "Gastrula"],
                    answer: 0,
                    explanation: "The 12-16 cell stage is called the morula before it becomes a blastocyst."
                }
            ],
            level2: [
                {
                    mechanism: "is a newborn evaluated for a facial anomaly during the first check-up",
                    exam: "has a unilateral cleft on the upper lip extending towards the nose with an intact palate.",
                    diagnostic: "Clinical observation: Failure of specific facial prominences to fuse properly during weeks 4-7.",
                    options: ["Maxillary & Medial Nasal Prominences", "Palatine Shelves", "Lateral & Medial Nasal Prominences", "Mandibular Prominences"],
                    answer: 0,
                    explanation: "Cleft lip happens when the maxillary and medial nasal prominences fail to fuse."
                }
            ],
            level3: [
                {
                    mechanism: "is an infant exhibiting poor feeding and rapid breathing",
                    exam: "A harsh holosystolic murmur is auscultated best at the left lower sternal border. The infant is non-cyanotic.",
                    diagnostic: "Echocardiogram: Left-to-right shunt through a defect in the membranous interventricular septum.",
                    options: ["Atrial Septal Defect", "Ventricular Septal Defect", "Tetralogy of Fallot", "Patent Ductus Arteriosus"],
                    answer: 1,
                    explanation: "Ventricular Septal Defect (VSD) is the most common congenital heart anomaly."
                }
            ],
            level4: [
                {
                    mechanism: "is a cyanotic newborn presenting with severe hypoxia shortly after birth",
                    exam: "Chest X-ray reveals a classic 'boot-shaped' heart and severe cyanosis.",
                    diagnostic: "Echocardiogram: Right ventricular hypertrophy, pulmonary stenosis, overriding aorta, and VSD.",
                    options: ["Transposition of Great Arteries", "Tetralogy of Fallot", "Truncus Arteriosus", "Tricuspid Atresia"],
                    answer: 1,
                    explanation: "Tetralogy of Fallot consists of four classic anatomical heart defects resulting from conotruncal malalignment."
                }
            ]
        },
        physiology: {
            body_fluids: [
                {
                    mechanism: "presents with severe watery diarrhea and vomiting for three days",
                    exam: "exhibits dry mucous membranes, poor skin turgor, low blood pressure, and concentrated dark urine. Total body water is reduced, primarily affecting the extracellular fluid (ECF) volume.",
                    diagnostic: "Lab results: Elevated serum osmolarity, high hematocrit due to hemoconcentration, normal total body solute count with low volume.",
                    options: ["Hypotonic Hydration (Water Intoxication)", "Isotonic ECF Volume Contraction (Dehydration)", "Hypertonic Cellular Swelling", "Edema via Increased Hydrostatic Pressure"],
                    answer: 1,
                    explanation: "Loss of isotonic fluids (like gastrointestinal fluids) leads to ECF volume contraction without significant shift between ICF and ECF initially."
                },
                {
                    mechanism: "complains of chronic fatigue, cold intolerance, and pale conjunctiva",
                    exam: "Complete Blood Count shows low hemoglobin levels, small microcytic red blood cells, and reduced mean corpuscular volume (MCV).",
                    diagnostic: "Iron panel: Low serum ferritin and low serum iron levels indicating deficient erythropoiesis.",
                    options: ["Pernicious Anemia (B12 Deficiency)", "Iron Deficiency Anemia", "Hemolytic Anemia", "Polycythemia Vera"],
                    answer: 1,
                    explanation: "Iron deficiency anemia results in microcytic, hypochromic red blood cells because iron is essential for heme synthesis in bone marrow."
                }
            ],
            nervous_muscular: [
                {
                    mechanism: "complains of progressive muscle weakness that worsens with repetitive activity and improves after rest",
                    exam: "shows bilateral ptosis (drooping eyelids) and facial muscle weakness. Reflexes and sensation are completely normal.",
                    diagnostic: "Serology: Presence of circulating antibodies directed against postsynaptic nicotinic acetylcholine receptors at the neuromuscular junction.",
                    options: ["Myasthenia Gravis", "Lambert-Eaton Syndrome", "Botulism", "Multiple Sclerosis"],
                    answer: 0,
                    explanation: "Myasthenia Gravis is an autoimmune condition blocking or destroying ACh receptors on the motor end plate, reducing end-plate potentials."
                },
                {
                    mechanism: "receives a local anesthetic injection prior to a minor skin procedure",
                    exam: "experiences temporary loss of pain sensation in the local area due to blocked nerve impulse propagation.",
                    diagnostic: "Electrophysiology: Voltage-gated sodium channels are reversibly blocked, preventing the depolarization phase of the action potential.",
                    options: ["Blocking Potassium Efflux", "Blocking Voltage-Gated Sodium Channels", "Enhancing GABA Receptors", "Blocking Calcium Influx"],
                    answer: 1,
                    explanation: "Local anesthetics work by binding to and blocking voltage-gated sodium channels, stopping nerve fibers from firing action potentials."
                }
            ],
            immune: [
                {
                    mechanism: "develops sudden hives, itching, and wheezing shortly after consuming peanuts",
                    exam: "Vital signs show low blood pressure and rapid pulse. The reaction is driven by rapid mast cell degranulation.",
                    diagnostic: "Serum test: Elevated allergen-specific IgE antibodies bound to high-affinity Fc receptors on mast cells and basophils.",
                    options: ["Type I Hypersensitivity (Anaphylaxis)", "Type II Cytotoxic Hypersensitivity", "Type III Immune Complex Disease", "Type IV Cell-Mediated Hypersensitivity"],
                    answer: 0,
                    explanation: "Type I hypersensitivity is an immediate allergic reaction mediated by IgE antibodies causing rapid release of histamine and inflammatory mediators."
                },
                {
                    mechanism: "develops a red, swollen, and warm localized reaction 48 hours after touching poison ivy leaves",
                    exam: "presents with delayed skin blistering and localized dermatitis at the contact site.",
                    diagnostic: "Biopsy: Infiltration of sensitized T-lymphocytes and macrophages rather than circulating antibodies.",
                    options: ["Type I Hypersensitivity", "Type II Hypersensitivity", "Type III Hypersensitivity", "Type IV Delayed-Type Hypersensitivity"],
                    answer: 3,
                    explanation: "Type IV hypersensitivity is cell-mediated (T-cells), taking 48-72 hours to develop, unlike immediate antibody-mediated responses."
                }
            ]
        }
    };

    let lastIndex = -1;

    function launchSimulator(region, category) {
        currentRegion = region;
        currentCategory = category;
        
        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('simulator-screen').style.display = 'block';
        
        const simTitle = document.getElementById('sim-title');
        let regionText = '';
        if (region === 'upper') regionText = 'Upper Limb';
        else if (region === 'lower') regionText = 'Lower Limb';
        else if (region === 'embryology') regionText = 'Embryology';
        else if (region === 'physiology') regionText = 'Physiology';

        let categoryText = '';
        if (region === 'embryology') {
            categoryText = `Level ${category.replace('level', '')}`;
        } else if (region === 'physiology') {
            if (category === 'body_fluids') categoryText = 'Body Fluids & Blood';
            else if (category === 'nervous_muscular') categoryText = 'Nervous & Muscular';
            else if (category === 'immune') categoryText = 'Immune System';
        } else {
            if (category === 'limbs') categoryText = 'Limb Development';
            else categoryText = category.charAt(0).toUpperCase() + category.slice(1) + ' Injuries';
        }
        
        simTitle.textContent = `⚡ ${regionText}: ${categoryText}`;
        
        generateCase(); 
    }

    function goHome() {
        document.getElementById('simulator-screen').style.display = 'none';
        document.getElementById('home-screen').style.display = 'flex';
    }

    function generateCase() {
        document.getElementById('feedback-box').style.display = 'none';
        document.getElementById('next-button').style.display = 'none';

        const templates = casesData[currentRegion][currentCategory];

        if (!templates || templates.length === 0) {
            document.getElementById('case-text').innerHTML = `<strong>Notice:</strong><br><br>More cases are coming soon to this section!`;
            document.getElementById('diagnostic-text').innerHTML = `[INVESTIGATIONS PENDING]`;
            document.getElementById('options-container').innerHTML = '';
            return;
        }

        let templateIndex;
        if (templates.length > 1) {
            do {
                templateIndex = Math.floor(Math.random() * templates.length);
            } while (templateIndex === lastIndex);
        } else {
            templateIndex = 0;
        }
        lastIndex = templateIndex;
        
        let template = templates[templateIndex];

        let vignette = "";
        if (currentRegion === 'embryology' || currentRegion === 'physiology') {
            vignette = `A patient ${template.mechanism}. On examination, ${template.exam}`;
        } else {
            let age = Math.floor(Math.random() * 52) + 18;
            let genderObj = genders[Math.floor(Math.random() * genders.length)];
            let occupation = occupations[Math.floor(Math.random() * occupations.length)];
            let side = sides[Math.floor(Math.random() * sides.length)];
            vignette = `A ${age}-year-old ${genderObj.id} ${occupation} ${template.mechanism}. On examination, ${genderObj.pro.toLowerCase()} ${template.exam}`;
            vignette = vignette.replace(/{pro}/g, genderObj.pro).replace(/{pos}/g, genderObj.pos).replace(/{side}/g, side);
        }

        document.getElementById('case-text').innerHTML = `<strong>Patient File:</strong><br><br>${vignette}`;
        document.getElementById('diagnostic-text').innerHTML = `[INVESTIGATIONS]<br>${template.diagnostic}`;

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        template.options.forEach((opt, idx) => {
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt;
            btn.onclick = () => checkAnswer(idx, btn, template);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedIndex, btn, template) {
        let buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(b => b.disabled = true);
        
        let feedback = document.getElementById('feedback-box');
        
        if (selectedIndex === template.answer) {
            btn.style.background = '#27ae60';
            btn.style.borderColor = '#2ecc71';
            feedback.className = 'feedback correct-feedback';
            feedback.innerHTML = `<strong>✓ Spot On.</strong><br><br>${template.explanation}`;
        } else {
            btn.style.background = '#c0392b';
            btn.style.borderColor = '#e74c3c';
            buttons[template.answer].style.background = '#27ae60';
            buttons[template.answer].style.borderColor = '#2ecc71';
            feedback.className = 'feedback incorrect-feedback';
            feedback.innerHTML = `<strong>✗ Incorrect Diagnosis.</strong><br><br>${template.explanation}`;
        }
        
        feedback.style.display = 'block';
        document.getElementById('next-button').style.display = 'block';
    }
</script>

</body>
</html>
